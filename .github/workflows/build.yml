name: Build and test
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        platform: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - name: Build, test native exports, and package
        shell: pwsh
        run: ./scripts/build.ps1 -Platform ${{ matrix.platform }} -Test -Package
      - uses: actions/upload-artifact@v4
        with:
          name: AwWatcherNPP-${{ matrix.platform }}
          path: dist/*.zip
